<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyGo Admin Pendidikan</title><style>
body{font:15px system-ui;background:#f1f5f9;color:#17212b;margin:0;padding:24px}main{max-width:960px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}.card{background:white;border-radius:12px;padding:18px;box-shadow:0 3px 18px #0f172a0d}.value{font-size:30px;font-weight:700;color:#0d9488}label{display:block;margin:10px 0 5px}input{padding:10px;border:1px solid #cbd5e1;border-radius:8px;width:min(100%,500px);box-sizing:border-box}button{padding:10px 16px;border:0;border-radius:8px;background:#0d9488;color:white;font-weight:700}#status{margin:16px 0;padding:12px;background:#e2e8f0;border-radius:8px}small{color:#64748b}</style></head><body><main><header><div><h1>Dashboard Pendidikan StudyGo</h1><small>Ringkasan pengguna dan aktivitas modul pendidikan</small></div><button id="refresh">Muat ulang</button></header>
<section class="card"><label>API Base URL</label><input id="api" placeholder="https://api.domainanda.id"><label>Access Token Admin</label><input id="token" type="password" autocomplete="off"><div id="status">Belum dimuat.</div></section>
<h2>Ringkasan</h2><section class="grid" id="cards"></section><section class="card"><h2>Pengguna baru — 7 hari</h2><pre id="chart">Belum ada data.</pre></section>
<script>
const statusBox=document.getElementById('status');
async function load(){try{const base=document.getElementById('api').value.replace(/\\/$/,'');const r=await fetch(base+'/api/v1/admin/education/dashboard',{headers:{Authorization:'Bearer '+document.getElementById('token').value}});const j=await r.json();if(!r.ok)throw Error(j.error||r.status);const labels={users:'Pengguna',materials:'Materi',tasks:'Tugas',notes:'Catatan',aiRequests:'Permintaan AI'};document.getElementById('cards').innerHTML=Object.entries(j.counts).map(([k,v])=>'<div class="card"><div>'+labels[k]+'</div><div class="value">'+v+'</div></div>').join('');document.getElementById('chart').textContent=(j.newUsersLast7Days||[]).map(x=>x.day+' : '+x.total+' pengguna').join('\\n')||'Belum ada pendaftaran dalam rentang ini.';statusBox.textContent='Data dashboard berhasil dimuat.'}catch(e){statusBox.textContent='Gagal: '+e.message}}
document.getElementById('refresh').onclick=load;
</script></main></body></html>
