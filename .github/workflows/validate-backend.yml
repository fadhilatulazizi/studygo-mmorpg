name: Validate Game Server and PHP Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    name: Build .NET GameServer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore GameServer/StudyGo.GameServer.csproj
      - name: Build
        run: dotnet build GameServer/StudyGo.GameServer.csproj --configuration Release --no-restore

  php:
    name: Validate PHP sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Syntax check PHP files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find Backend -type f -name '*.php' -not -path '*/vendor/*' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP files found under Backend/"
            exit 1
          fi
          for file in "${files[@]}"; do
            php -l "$file"
          done

  migrations:
    name: Validate migration ordering and basic SQL hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check migration filenames and non-empty files
        shell: bash
        run: |
          set -euo pipefail
          dir="Backend/database/migrations"
          test -d "$dir"
          mapfile -t files < <(find "$dir" -maxdepth 1 -type f -name '[0-9][0-9][0-9]_*.sql' | sort)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            test -s "$file"
            grep -Eiq 'CREATE TABLE|ALTER TABLE|INSERT INTO|UPDATE ' "$file"
            echo "Validated $file"
          done

  mysql-integration:
    name: MySQL migration and integration smoke tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_DATABASE: studygo_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, fileinfo, openssl
      - name: Apply schema and migrations
        env:
          MYSQL_PWD: test-root-password
        run: |
          set -euo pipefail
          mysql -h127.0.0.1 -uroot studygo_test < Backend/database/migrations/001_world_map.sql
          mysql -h127.0.0.1 -uroot studygo_test < Backend/database/schema.sql
          mysql -h127.0.0.1 -uroot studygo_test < Backend/database/migrations/000_studygo_auth.sql
          for file in Backend/database/migrations/002_*.sql Backend/database/migrations/003_*.sql Backend/database/migrations/004_*.sql Backend/database/migrations/005_*.sql Backend/database/migrations/006_*.sql Backend/database/migrations/007_*.sql Backend/database/migrations/008_*.sql Backend/database/migrations/009_*.sql; do
            mysql -h127.0.0.1 -uroot studygo_test < "$file"
          done
      - name: Run database integration smoke tests
        env:
          TEST_DB_DSN: mysql:host=127.0.0.1;dbname=studygo_test;charset=utf8mb4
          TEST_DB_USER: root
          TEST_DB_PASSWORD: test-root-password
        run: php Backend/tests/integration.php
