name: Build StudyGo Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'FlutterApp/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-android:
    name: Build Flutter APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and install API 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        working-directory: FlutterApp
        run: flutter create --platforms=android --project-name studygo_app .

      - name: Install dependencies
        working-directory: FlutterApp
        run: flutter pub get

      - name: Force Android compile SDK 36 for app and plugins
        working-directory: FlutterApp
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          app_files = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]
          app_file = next((p for p in app_files if p.is_file()), None)
          if app_file is None:
              raise SystemExit("Android app Gradle file not found")

          gradle_files = [app_file]
          pub_cache = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          if pub_cache.exists():
              gradle_files.extend(pub_cache.glob("*/android/build.gradle"))
              gradle_files.extend(pub_cache.glob("*/android/build.gradle.kts"))

          pattern = re.compile(
              r"(?m)^(\s*compileSdk(?:Version)?\s*=?\s*)"
              r"(?:flutter\.compileSdkVersion|\d+)(\s*(?://.*)?)$"
          )
          changed = []
          for gradle_file in gradle_files:
              original = gradle_file.read_text()
              updated, count = pattern.subn(r"\g<1>36\g<2>", original)
              if count:
                  gradle_file.write_text(updated)
                  changed.append(str(gradle_file))

          app_text = app_file.read_text()
          if not re.search(r"(?m)^\s*compileSdk(?:Version)?\s*=?\s*36\s*$", app_text):
              raise SystemExit(f"Failed to set app compileSdk to 36 in {app_file}")

          print(f"Set compileSdk 36 in {len(changed)} Gradle files:")
          for name in changed:
              print(f" - {name}")
          PY

      - name: Analyze Dart source
        working-directory: FlutterApp
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        working-directory: FlutterApp
        run: flutter test --no-pub

      - name: Build installable debug APK
        working-directory: FlutterApp
        run: flutter build apk --debug --dart-define=STUDYGO_API_URL=https://api.studygo.turaja.id

      - name: Build release Android App Bundle
        working-directory: FlutterApp
        run: flutter build appbundle --release --dart-define=STUDYGO_API_URL=https://api.studygo.turaja.id

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: studygo-android-build
          if-no-files-found: error
          retention-days: 14
          path: |
            FlutterApp/build/app/outputs/flutter-apk/app-debug.apk
            FlutterApp/build/app/outputs/bundle/release/app-release.aab
