name: Build StudyGo Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'FlutterApp/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-android:
    name: Build Flutter APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        working-directory: FlutterApp
        run: flutter create --platforms=android --project-name studygo_app .

      - name: Install dependencies
        working-directory: FlutterApp
        run: flutter pub get

      - name: Analyze Dart source
        working-directory: FlutterApp
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        working-directory: FlutterApp
        run: flutter test --no-pub

      - name: Build installable debug APK
        working-directory: FlutterApp
        run: flutter build apk --debug --dart-define=STUDYGO_API_URL=https://YOUR_API_HOST

      - name: Build release Android App Bundle
        working-directory: FlutterApp
        run: flutter build appbundle --release --dart-define=STUDYGO_API_URL=https://YOUR_API_HOST

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: studygo-android-build
          if-no-files-found: error
          retention-days: 14
          path: |
            FlutterApp/build/app/outputs/flutter-apk/app-debug.apk
            FlutterApp/build/app/outputs/bundle/release/app-release.aab
