name: Build StudyGo Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'FlutterApp/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-android:
    name: Build Flutter APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        working-directory: FlutterApp
        run: flutter create --platforms=android --project-name studygo_app .

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set Android compile SDK 36
        working-directory: FlutterApp
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
            grep -q 'compileSdk = 36' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
            sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 36/' android/app/build.gradle
            grep -Eq 'compileSdk(Version)? 36' android/app/build.gradle
          else
            echo "Android app Gradle file not found" >&2
            exit 1
          fi

      - name: Install dependencies
        working-directory: FlutterApp
        run: flutter pub get

      - name: Analyze Dart source
        working-directory: FlutterApp
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        working-directory: FlutterApp
        run: flutter test --no-pub

      - name: Build installable debug APK
        working-directory: FlutterApp
        run: flutter build apk --debug --dart-define=STUDYGO_API_URL=https://YOUR_API_HOST

      - name: Build release Android App Bundle
        working-directory: FlutterApp
        run: flutter build appbundle --release --dart-define=STUDYGO_API_URL=https://YOUR_API_HOST

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: studygo-android-build
          if-no-files-found: error
          retention-days: 14
          path: |
            FlutterApp/build/app/outputs/flutter-apk/app-debug.apk
            FlutterApp/build/app/outputs/bundle/release/app-release.aab
