name: Game Server Build

on:
  push:
    paths:
      - 'GameServer/**'
      - '.github/workflows/dotnet-check.yml'
  pull_request:
    paths:
      - 'GameServer/**'
      - '.github/workflows/dotnet-check.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build game server
        run: dotnet build GameServer/StudyGo.GameServer.csproj --configuration Release
